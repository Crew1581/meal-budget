[project]
name = "meal-budget"
version = "0.1.0"
description = "Минимальный backend планирования питания"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1,<1.0",
    "httpx>=0.28.1,<1.0",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.13.4,<3.0",
    "pydantic-settings>=2.15.0,<3.0",
    "uvicorn>=0.52.3,<1.0",
    "yoyo-migrations>=9.0,<10",
]

[dependency-groups]
dev = ["pytest>=8.4.2,<10.0", "ruff>=0.12.9,<1.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: интеграционные проверки на отдельной настоящей PostgreSQL"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
